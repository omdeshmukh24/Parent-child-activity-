apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app
        image: 172.31.45.245:5000/python-app:latest

        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service

metadata:
  name: python-app-service

spec:
  selector:
    app: python-app

  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080

  type: NodePort


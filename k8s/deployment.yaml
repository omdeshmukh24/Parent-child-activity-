apiVersion: apps/v1
kind: Deployment

metadata:
  name: parent-child-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: parent-child-app

  template:
    metadata:
      labels:
        app: parent-child-app

    spec:
      containers:
      - name: parent-child-app
        image: omdeshmukh24/parent-child-app:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service

metadata:
  name: parent-child-service

spec:
  selector:
    app: parent-child-app

  type: NodePort

  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080
